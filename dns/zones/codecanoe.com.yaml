# codecanoe.com zone — the source of truth. Edit here, then `bin/dns` to
# preview and `bin/dns --doit` to push to deSEC.
#
# TTL defaults to 3600 (config.yaml). deSEC enforces a 3600s minimum, so
# don't set anything lower.
#
# Records mirrored from Namecheap on migration:
#   - A records: from the Advanced DNS host table.
#   - MX (Google Workspace): these were NOT in Namecheap's host table — they
#     lived under the "Mail Settings" preset, which stops working once the
#     nameservers move. Recreated explicitly here. DO NOT DROP or mail breaks.
#   - TXT: google-site-verification + the github challenge.
---
'':
  - type: A
    value: 75.2.60.5
  # deSEC auto-manages the apex NS. Declared here so octoDNS sees no diff
  # and never tries to delete them (which would break delegation).
  - type: NS
    values:
      - ns1.desec.io.
      - ns2.desec.org.
  - type: MX
    values:
      - exchange: aspmx.l.google.com.
        preference: 1
      - exchange: alt1.aspmx.l.google.com.
        preference: 5
      - exchange: alt2.aspmx.l.google.com.
        preference: 5
      - exchange: aspmx2.googlemail.com.
        preference: 10
      - exchange: aspmx3.googlemail.com.
        preference: 10
  - type: TXT
    values:
      - google-site-verification=MM8hvTaOGmSq0VkDI4VvEmfAZdZiL2lcgXGpQhzcXpM
      - google-site-verification=Db94IMSWnfvzzQ36yT2oQJ-2kQqVJiB1sgEJlJkdJ4E

